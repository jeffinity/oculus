version: v1
managed:
  enabled: true
  go_package_prefix: 
    default: github.com/jeffinity/oculus/api
plugins:
  - plugin: go
    out: ../api
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../api
    opt:
      - paths=source_relative
  - plugin: go-http
    out: ../api
    opt:
      - paths=source_relative
  - plugin: openapiv2
    out: ../api
    opt:
      - logtostderr=true
