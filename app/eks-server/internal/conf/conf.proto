syntax = "proto3";

package app.eks_server;

option go_package = "internal/conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Log log = 1;
  MCP mcp = 2;
  repeated EKSCluster eks = 3;
}

message Log {
  bool disable_std_log = 1;
  string log_dir = 2;
  string log_filename = 3;
  string level = 4;

  int32 max_size_mb = 10;
  int32 max_backups = 11;
  int32 max_age_days = 12;
  bool compress = 13;
  bool rotate_daily = 14;
}

message MCP {
  string server_name = 1;
  string server_version = 2;
  int32 max_output_bytes = 3;
  int32 max_concurrent_requests = 4;
}

message EKSCluster {
  string name = 1;
  JumpServer jumpserver = 2;
  repeated EKSEnv envs = 3;
}

message JumpServer {
  string host = 1;
  uint32 port = 2;
  string user = 3;
  string identity_file = 4;
  string identity_passphrase_env = 5;
  string socks5_proxy = 6;
  bool insecure_ignore_host_key = 7;
  google.protobuf.Duration connect_timeout = 8;
}

message Pool {
  int32 min_size = 1;
  int32 max_size = 2;
  google.protobuf.Duration command_timeout = 3;
  google.protobuf.Duration idle_ttl = 4;
  google.protobuf.Duration health_check_interval = 5;
  google.protobuf.Duration health_check_timeout = 6;
  string health_check_command = 7;
}

message EKSEnv {
  string name = 1;
  string asset = 2;
  string opt_prompt = 3;
  string shell_prompt = 4;
  Pool query_pool = 5;
  Pool deploy_pool = 6;
}
