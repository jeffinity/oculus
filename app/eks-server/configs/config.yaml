log:
  level: INFO
  log_dir: /tmp/eks-server
  log_filename: eks-server.log
  max_backups: 10
  rotate_daily: true
  max_size_mb: 100
  compress: true

mcp:
  server_name: oculus-eks-server
  server_version: v0.1.0
  max_output_bytes: 262144
  max_concurrent_requests: 32

eks:
  - name: jumpserver-sg
    jumpserver:
      host: jumpserver-sg.gainetics.io
      port: 2222
      user: jeff
      identity_file: ~/.ssh/id_ed25519
      socks5_proxy: 10.10.10.2:12345
      insecure_ignore_host_key: true
      connect_timeout: 60s
    envs:
      - name: dev
        asset: gainetics-eks-dev-cluster-admin
        opt_prompt: "Opt>"
        shell_prompt: "gainetics-eks-dev-cluster-admin#"
        query_pool:
          min_size: 0
          max_size: 1
          command_timeout: 45s
          idle_ttl: 1200s
          health_check_interval: 60s
          health_check_timeout: 10s
          health_check_command: echo oculus-eks-health
        deploy_pool:
          min_size: 0
          max_size: 3
          command_timeout: 600s
          idle_ttl: 1200s
          health_check_interval: 120s
          health_check_timeout: 10s
          health_check_command: echo oculus-eks-health
      - name: test
        asset: gainetics-eks-dev-cluster-admin
        opt_prompt: "Opt>"
        shell_prompt: "gainetics-eks-dev-cluster-admin#"
        query_pool:
          min_size: 0
          max_size: 1
          command_timeout: 45s
          idle_ttl: 1200s
          health_check_interval: 60s
          health_check_timeout: 10s
          health_check_command: echo oculus-eks-health
        deploy_pool:
          min_size: 0
          max_size: 3
          command_timeout: 600s
          idle_ttl: 1200s
          health_check_interval: 120s
          health_check_timeout: 10s
          health_check_command: echo oculus-eks-health
