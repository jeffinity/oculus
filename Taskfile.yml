# go install github.com/go-task/task/v3/cmd/task@latest
version: '3'

vars:
  MODULE_NAME: { sh: go list -m | head -n 1 }
  LOCAL_OS: { sh:  go env GOOS }
  LOCAL_ARCH: { sh:  go env GOARCH }

tasks:
  check:
    desc: Env check
    cmds:
      - cmd: .build/tools_check.sh
        silent: true

  proto:
    desc: Gen proto
    deps: [check]
    cmds:
      - cmd: .build/build_api.sh
        silent: true

  format:
    desc: Format *go code
    deps: [check]
    cmds:
      - cmd: bash .build/format.sh all
        silent: true

  format-app:
    desc: Format {app}/*go code
    deps: [check]
    cmds:
      - cmd: bash .build/format.sh {{.CLI_ARGS}}
        silent: true

  lint:
    cmds:
      - cmd: bash .build/lint.sh
        silent: true

  conf:
    desc: Gen {app}/internal/conf/*.proto
    deps: [check]
    cmds:
      - cmd: bash .build/build_config.sh {{.CLI_ARGS}}
        silent: true

  wire:
    cmds:
      - cmd: 'if [[ "{{.CLI_ARGS}}" =~ [[:space:]] ]]; then echo "Usage: task build -- app_path" && exit 1; fi'
        silent: true
      - cmd: 'name={{.CLI_ARGS}}; if [ -z "${name}" ]; then echo "Error: app_path is required for build task"; exit 1; fi'
        silent: true
      - cmd: if [ ! -d "{{.CLI_ARGS}}" ]; then echo "dir {{.CLI_ARGS}} not exist!"; exit 1; fi
        silent: true
      - cmd: bash {{.TOOLS_DIR}}/script/dev_tool_check.sh
        silent: true
      - cmd: echo 'Start gen wire {{.CLI_ARGS}}'
        silent: true
      - cmd: 'cd {{.CLI_ARGS}} && wire ./... && echo "Gen wire success!"'
        silent: true
      - cmd: task format-app -- {{.CLI_ARGS}}
        silent: true

  wire-all:
    cmds:
      - cmd: bash {{.TOOLS_DIR}}/script/dev_tool_check.sh
        silent: true
      - cmd: echo 'Start gen wire for all app'
        silent: true
      - cmd: find app -type d -mindepth 1 -maxdepth 1 -exec sh -c 'cd "$1" && echo "Gen wire for $1" && wire ./... ' sh {} \;
        silent: true
      - cmd: task format
        silent: true
